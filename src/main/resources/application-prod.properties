# ===========================================================================
# PROD profile.
#
# Activate with: SPRING_PROFILES_ACTIVE=prod  (set in the systemd launcher).
#
# NO SECRET HAS A DEFAULT IN THIS FILE, BY DESIGN.
# Every ${VAR} below with no ":default" must be supplied by the launcher.
# If one is missing the app fails to start — which is the point. A default
# here would let a mis-configured service boot quietly against the wrong
# database or Stripe account.
# ===========================================================================

# No default: must be supplied by the launcher.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate must never alter a taxpayer-data schema at boot.
# Schema changes are applied by Flyway. "validate" catches entity/table drift.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Update these to match your production domain before go-live.
app.cors.allowed-origins=https://your-domain.com
app.frontend.reset-password-url=https://your-domain.com/reset-password

# Mail. NO DEFAULT — a mis-configured prod box must not silently send from
# a dev mailbox.
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

# JWT signing secret — NO DEFAULT. A missing secret must refuse to start.
app.jwt.secret=${APP_JWT_SECRET}

# Stripe LIVE key — NO DEFAULT.
app.stripe.secret-key=${STRIPE_SECRET_KEY}

# Swagger closed in prod; the API contract must not leak to anonymous callers.
app.swagger.public=false

logging.level.org.springframework.security=WARN
logging.level.com.example.form8038cp=INFO
