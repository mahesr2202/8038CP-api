spring.application.name=form8038cp-api

# ===========================================================================
# BASE CONFIGURATION
#
# All values here carry dev-safe defaults so the app starts in an IDE
# without setting SPRING_PROFILES_ACTIVE.
#
# The prod Spring profile (application-prod.properties) overrides every
# secret with ${ENV_VAR} — no fallback — so a misconfigured prod box
# fails to boot rather than silently using a dev value.
# ===========================================================================

server.port=${SERVER_PORT:8080}

# ── Datasource ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/form8038cp?currentSchema=form8038cp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=form8038cp
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────────────────────────
#spring.flyway.enabled=true
#spring.flyway.schemas=form8038cp
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.zoho.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:suriyavasi.g@problemfirsttech.com}
spring.mail.password=${SMTP_PASSWORD:Suriya@2111}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 3 s default is too tight for real internet SMTP — measured ~3.2 s to
# smtp.zoho.com:587 before STARTTLS/AUTH even started.
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:dev-secret-must-be-at-least-32-bytes-long!!}
app.jwt.issuer=form8038cp-api
app.jwt.expiration-ms=3600000
app.jwt.remember-me-expiration-ms=2592000000

# ── CORS / Frontend URLs ──────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# ── Password reset / Email OTP ────────────────────────────────────────────────
app.password-reset.token-expiry-minutes=60
app.email-otp.code-expiry-minutes=15
app.email-otp.max-attempts=5

# ── Stripe ────────────────────────────────────────────────────────────────────
app.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_REPLACE}
stripe.currency=usd

# ── IRS e-file Submission ─────────────────────────────────────────────────────
# Replace with values issued by the IRS Modernized e-File (MeF) programme.
app.irs.efin=${IRS_EFIN:212103}
app.irs.software-id=${IRS_SOFTWARE_ID:26026014}
app.irs.software-version=${IRS_SOFTWARE_VERSION:1.0.0}
app.irs.vendor-control-num=${IRS_VENDOR_CONTROL_NUM:ABCD1234EFGH5678}
# 40-character uppercase hex Device ID (SHA-1 length) registered with IRS
app.irs.device-id=${IRS_DEVICE_ID:0000000000000000000000000000000000000001}
app.irs.tax-year=${IRS_TAX_YEAR:2026}
app.irs.tax-period-end=${IRS_TAX_PERIOD_END:2026-12-31}
# IPv4 address reported in FilingSecurityInformation (reflect submitter's IP in prod)
app.irs.client-ip=${IRS_CLIENT_IP:8.8.8.8}
app.irs.practitioner-pin=${IRS_PRACTITIONER_PIN:11111}

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
# Open by default so the contract is browsable in dev without a token.
# The prod profile hard-codes this to false.
app.swagger.public=${APP_SWAGGER_PUBLIC:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── PDF Templates ─────────────────────────────────────────────────────────────
app.irs.pdf.f8038cp-template=docs/2026-pdf/f8038cp.pdf
app.irs.pdf.schedule-a-template=docs/2026-pdf/scheduleA.pdf
